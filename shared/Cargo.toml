[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = [
  "tokio/full",
  "tracing-subscriber/env-filter",
  "dirs",
  "agent-client-protocol",
  "tokio-util",
  "gethostname",
  "libc",
  "portable-pty",
  "sysinfo",
]
# Mobile: minimal dependencies for remote agent sessions
mobile = [
  "tokio/full",
  "tracing-subscriber/env-filter",
  "dirs",
  "libc",
  "gethostname",
  "tokio-util",
]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
iroh = { workspace = true }
iroh-tickets = { workspace = true }
bincode = { workspace = true }
chacha20poly1305 = { workspace = true }
aead = { workspace = true }
rand = { workspace = true }
data-encoding = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true, optional = true }
ignore = "0.4"
base64 = { workspace = true }
hex = { workspace = true }
postcard = { workspace = true }
n0-future = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
iroh-base = { workspace = true }
tracing-subscriber = { version = "0.3", optional = true }

# Agent related dependencies - only included in std feature
agent-client-protocol = { workspace = true, features = [
  "unstable",
], optional = true }
tokio-util = { workspace = true, optional = true }
gethostname = { workspace = true, optional = true }
thiserror = "2.0"
libc = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
bytes = { workspace = true }

# System monitoring - only in std
sysinfo = { version = "0.39", optional = true }

# Mobile build: use rustls instead of native-tls to avoid OpenSSL linking issues
# and exclude heavy agent dependencies
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }

[dev-dependencies]
tempfile = "3"
