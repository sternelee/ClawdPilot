[workspace]
members = ["cli", "shared", "app", "browser/crate"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.47", features = [
  "full",
  "net",
  "fs",
  "rt-multi-thread",
] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.9"
crossterm = "0.29"
uuid = { version = "1.17", features = ["v4", "js"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "1.0.3", default-features = false }
iroh-tickets = "1.0.0"
bytes = "1.10"
futures = "0.3"
rand = "0.10"
tauri = { version = "2" }
bincode = "1.3"
chacha20poly1305 = "0.11"
aead = "0.6"
base64 = "0.23"
hex = "0.4"
data-encoding = "2.6"
url = "2.5"
regex = "1.10"
dirs = "6.0"
futures-util = "0.3"
async-trait = "0.1"
agent-client-protocol = "0.12.1"
tokio-util = { version = "0.7", features = ["compat"] }
gethostname = "1.1"
libc = "0.2"
postcard = "1.1.1"
n0-future = "0.3"

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.production]
inherits = "release"
panic = "abort"

# Patch tyzen 0.2.4: gates std::os::unix::net::SocketAddr import behind
# cfg(unix) so it compiles on Windows. Upstream bug:
# https://github.com/tyzen-rs/tyzen (unreleased fix).
[patch.crates-io]
tyzen = { path = "patches/tyzen" }
